specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: QuantumSmartWallet
    network: sepolia
    source:
      address: "0x6F0d410f7f0514A65fAB25431F61f4eDdf898c3A"
      abi: QuantumSmartWallet
      startBlock: 11450631
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transaction
        - Identity
        - VaultFile
        - Guardian
      abis:
        - name: QuantumSmartWallet
          file: ./abis/QuantumSmartWallet.json
      eventHandlers:
        - event: Executed(indexed address,uint256,bytes)
          handler: handleExecuted
        - event: Deposited(indexed address,uint256)
          handler: handleDeposited
        - event: IdentityUpdated(indexed address,string)
          handler: handleIdentityUpdated
        - event: VaultFileAdded(indexed address,string)
          handler: handleVaultFileAdded
        - event: GuardianAdded(indexed address,indexed address)
          handler: handleGuardianAdded
      file: ./src/mapping.ts
