specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: QuantumSmartWalletFactory
    network: sepolia
    source:
      address: "0xA08372471185Fc8C6D701750634d5e2DbaE80144"
      abi: QuantumSmartWalletFactory
      startBlock: 11450631
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Account
      abis:
        - name: QuantumSmartWalletFactory
          file: ./abis/QuantumSmartWalletFactory.json
        - name: QuantumSmartWallet
          file: ./abis/QuantumSmartWallet.json
      eventHandlers:
        - event: AccountCreated(indexed address,indexed address)
          handler: handleAccountCreated
      file: ./src/mapping.ts
templates:
  - kind: ethereum
    name: QuantumSmartWallet
    network: sepolia
    source:
      abi: QuantumSmartWallet
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Transaction
        - Identity
        - VaultFile
        - Guardian
      abis:
        - name: QuantumSmartWallet
          file: ./abis/QuantumSmartWallet.json
      eventHandlers:
        - event: Executed(indexed address,uint256,bytes)
          handler: handleExecuted
        - event: Deposited(indexed address,uint256)
          handler: handleDeposited
        - event: IdentityUpdated(indexed address,string)
          handler: handleIdentityUpdated
        - event: VaultFileAdded(indexed address,string)
          handler: handleVaultFileAdded
        - event: GuardianAdded(indexed address,indexed address)
          handler: handleGuardianAdded
      file: ./src/mapping.ts
